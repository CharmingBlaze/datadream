name: Release



on:

  workflow_dispatch:

    inputs:

      tag:

        description: "Release tag (e.g. v1.0.0)"

        required: true

        default: "v1.0.0"

      skip_clang:

        description: "Skip bundling Clang in zip (smaller artifact)"

        required: false

        default: "false"

        type: choice

        options:

          - "false"

          - "true"

      skip_verify:

        description: "Skip packdist verify (doctor + hello + coin-runner in zip tree)"

        required: false

        default: "false"

        type: choice

        options:

          - "false"

          - "true"

      skip_studio:

        description: "Skip building datadream-studio IDE (smaller artifact)"

        required: false

        default: "false"

        type: choice

        options:

          - "false"

          - "true"

      draft:

        description: "Create as draft release (review before publishing)"

        required: false

        default: "true"

        type: choice

        options:

          - "true"

          - "false"



  push:

    tags:

      - "v*"



jobs:

  release-windows:

    name: Release zip (Windows)

    runs-on: windows-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5

        with:

          go-version: "1.22"

      - name: Build distribution

        shell: pwsh

        env:

          GOFLAGS: "-mod=mod"

        run: |

          $args = @()

          if ('${{ inputs.skip_clang }}' -eq 'true') { $args += '-SkipClang' }

          if ('${{ inputs.skip_verify }}' -eq 'true') { $args += '-SkipVerify' }

          if ('${{ inputs.skip_studio }}' -eq 'true') { $args += '-SkipStudio' }

          .\scripts\build-dist.ps1 @args

      - name: Upload zip

        uses: actions/upload-artifact@v4

        with:

          name: datadream-windows-amd64

          path: dist/datadream-windows-amd64.zip



  release-linux:

    name: Release zip (Linux)

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5

        with:

          go-version: "1.22"

      - name: Install build deps

        run: |

          sudo apt-get update

          sudo apt-get install -y clang libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev

          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config imagemagick nodejs npm

      - name: Build distribution

        env:

          GOFLAGS: "-mod=mod"

        run: |

          ARGS=""

          if [ "${{ inputs.skip_clang }}" = "true" ]; then ARGS="$ARGS --skip-clang"; fi

          if [ "${{ inputs.skip_verify }}" = "true" ]; then ARGS="$ARGS --skip-verify"; fi

          if [ "${{ inputs.skip_studio }}" = "true" ]; then ARGS="$ARGS --skip-studio"; fi

          ./scripts/build-dist.sh $ARGS

      - name: Upload zip

        uses: actions/upload-artifact@v4

        with:

          name: datadream-linux-amd64

          path: dist/datadream-linux-amd64.zip



  release-macos:

    name: Release zip (macOS arm64)

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5

        with:

          go-version: "1.22"

      - name: Build distribution

        env:

          GOFLAGS: "-mod=mod"

        run: |

          ARGS=""

          if [ "${{ inputs.skip_clang }}" = "true" ]; then ARGS="$ARGS --skip-clang"; fi

          if [ "${{ inputs.skip_verify }}" = "true" ]; then ARGS="$ARGS --skip-verify"; fi

          if [ "${{ inputs.skip_studio }}" = "true" ]; then ARGS="$ARGS --skip-studio"; fi

          ./scripts/build-dist.sh $ARGS

      - name: Upload zip

        uses: actions/upload-artifact@v4

        with:

          name: datadream-darwin-arm64

          path: dist/datadream-darwin-arm64.zip



  publish:

    name: Publish GitHub Release

    needs: [release-windows, release-linux, release-macos]

    runs-on: ubuntu-latest

    permissions:

      contents: write

    steps:

      - uses: actions/download-artifact@v4

        with:

          pattern: datadream-*

          merge-multiple: true

          path: dist



      - name: Resolve release tag

        id: meta

        run: |

          if [ "${{ github.event_name }}" = "push" ]; then

            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

            echo "draft=false" >> "$GITHUB_OUTPUT"

          else

            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"

          fi



      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ steps.meta.outputs.tag }}

          name: DataDream ${{ steps.meta.outputs.tag }}

          draft: ${{ steps.meta.outputs.draft }}

          generate_release_notes: true

          files: |

            dist/datadream-windows-amd64.zip

            dist/datadream-linux-amd64.zip

            dist/datadream-darwin-arm64.zip

          body: |

            ## Install



            1. Download the zip for your platform below.

            2. Extract it and add `bin/` to your PATH (or set `DATADREAM_ROOT` to the extract folder).

            3. Run `datadream doctor`.

            4. Run `datadream new my-game && cd my-game && datadream run game.dd`.



            ## DataDream Studio (IDE)



            Each release zip includes the desktop IDE under `bin/`:



            | Platform | IDE binary |

            |----------|------------|

            | Windows | `bin/datadream-studio.exe` |

            | Linux | `bin/datadream-studio-x86_64.AppImage` (self-contained) |

            | macOS | `bin/datadream-studio.app` |



            Launch from the CLI: `datadream studio` (opens the IDE in your project folder).



            No Go install required. Windows zips include bundled Clang (~188 MB).



            See [docs/DISTRIBUTION.md](https://github.com/${{ github.repository }}/blob/main/docs/DISTRIBUTION.md) and [docs/STUDIO.md](https://github.com/${{ github.repository }}/blob/main/docs/STUDIO.md).

